name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A post dated in the future stays out of the build until its date (see
  # src/lib/schedule.ts), so the site rebuilds every day at 00:10 in Mexico
  # City (UTC-6, no daylight saving) to publish whatever came due.
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # astro check catches a chrome string missing from one language; the
      # tests catch a post or page without its translation. Either one stops
      # the deploy below.
      - name: Type-check
        run: npm run check

      - name: Test bilingual coverage
        run: npm test

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=diegosaid
